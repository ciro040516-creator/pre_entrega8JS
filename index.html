<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador "Teenage Babe"</title>
    <link rel="stylesheet" href="./css/syle.css">

    <!--Link Iconos-->
    <script src="https://kit.fontawesome.com/9e89734234.js" crossorigin="anonymous"></script>

    <script defer src="./js/main.js"></script>
</head>

<body>
    <header>
        <img class="logo_tb" src="./img//logo_tb.jpg" alt="logo_tb">
        <nav id="box-seccion"></nav>
    </header>

    <section class="filtros" id="container-buscador">
        <input type="search" id="buscador-Item" placeholder="Buscar por nombre...">
        <i class="fa-solid fa-magnifying-glass"></i>
    </section>

    <main>
        <p class="mensaje-Inicio bricolage"></p>

        <form action="#" method="post">
            <label>
                <i class="fa-solid fa-user"></i>
                <input type="number" id="ID" placeholder="ID" required>
            </label>
            <label>
                <i class="fa-solid fa-lock"></i>
                <input type="number" id="password" placeholder="Contraseña" required>
            </label>
            <button class="button" id="boton">Ingresar</button>
        </form>

        <h4 class="para-Ana"></h4>
        <h4 class="mensaje-general"></h4>

    </main>

    <section class="formPeople">
        <form id="registroPeople">
            <input type="number" id="nuevoNumero" placeholder="N° de Lista">
            <input type="text" id="nuevoNombre" placeholder="Nombre">
            <input type="text" id="nuevoTelefono" placeholder="Teléfono">
            <button onclick="añadirPeople()">Agregar</button>
        </form>
    </section>

    <section>
        <div id="container-tabla" class="tabla1">
            <table border="1">
                <thead>
                    <tr>
                        <th>N° de Lista</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody id="lista-general"></tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>© 2026 Proyectos Di&Bere. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
